name: Deploy Dev to EC2

on:
  push:
    branches:
      - dev  # triggers only on dev branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /var/www/apps/github-actions-demo

            echo "Pulling latest code..."
            git fetch origin
            git checkout dev
            git pull origin dev

            echo "Installing dependencies..."
            npm install

            echo "Building TypeScript..."
            npm run build

            echo "Reloading PM2 dev app..."
            pm2 reload ecosystem.config.js --only github-actions-demo-dev || \
            pm2 start ecosystem.config.js --only github-actions-demo-dev

            pm2 save