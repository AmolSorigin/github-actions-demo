name: Deploy Prod to EC2

on:
  push:
    branches:
      - prod  # triggers only on prod branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /var/www/apps/github-actions-demo

            echo "Pulling latest code..."
            git fetch origin
            git checkout prod
            git pull origin prod

            echo "Installing dependencies..."
            npm install

            echo "Building TypeScript..."
            npm run build

            echo "Reloading PM2 prod app..."
            pm2 reload ecosystem.config.js --only github-actions-demo-prod || \
            pm2 start ecosystem.config.js --only github-actions-demo-prod

            pm2 save